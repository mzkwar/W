app = "war-center-ftth"
primary_region = "fra" # يمكنك اختيار أقرب سيرفر مثل فرانكفورت

[build]
  builder = "paketobuildpacks/builder:base"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false # يمنع توقف السيرفر أو دخوله في وضع النوم
  auto_start_machines = true
  min_machines_running = 1   # يضمن بقاء السيرفر يعمل دائماً

[[mounts]]
  source = "sqlite_data"
  destination = "/data"
