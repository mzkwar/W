<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الوكيل الثانوي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
    <div id="sub-login" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mt-20">
        <h2 class="text-xl font-bold mb-4 text-center">دخول الوكيل الثانوي</h2>
        <form id="sub-login-form" class="space-y-3">
            <input type="text" id="sub-user" placeholder="اسم المستخدم" class="w-full border p-2 rounded-lg" required>
            <input type="password" id="sub-pass" placeholder="كلمة المرور" class="w-full border p-2 rounded-lg" required>
            <button class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold">دخول</button>
        </form>
    </div>

    <div id="sub-dashboard" class="hidden max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 id="welcome-msg" class="text-xl font-bold mb-4 border-b pb-2">لوحة المشتركين الخاصة بي</h1>
        <ul id="my-subscribers-list" class="divide-y text-sm"></ul>
    </div>

    <script>
        document.getElementById('sub-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/subagent/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('sub-user').value,
                    password: document.getElementById('sub-pass').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('sub-login').classList.add('hidden');
                document.getElementById('sub-dashboard').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = `أهلاً بك: ${data.name}`;
                loadMySubs(data.id);
            } else {
                alert(data.error);
            }
        });

        async function loadMySubs(agentId) {
            const res = await fetch(`/api/subagent/my-subscribers/${agentId}`);
            const ids = await res.json();
            const list = document.getElementById('my-subscribers-list');
            list.innerHTML = ids.map(id => `<li class="py-2">👤 مشترك رقم / ID: <span class="font-bold">${id}</span></li>`).join('');
        }
    </script>
</body>
</html>
